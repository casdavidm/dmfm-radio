name: Build iOS (.ipa)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package DMFMRadio IPA
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: |
          if [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project with XcodeGen
        run: |
          xcodegen generate

      - name: Build App & Package .ipa
        run: |
          set -o pipefail
          xcodebuild build \
            -project DMFMRadio.xcodeproj \
            -scheme DMFMRadio \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build 2>&1 | tee xcodebuild.log

          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          # Firma ad hoc conservando los entitlements (App Group) de la extensión y de la app
          codesign --force --sign - --entitlements DMFMRadioWidget/DMFMRadioWidget.entitlements Payload/*.app/PlugIns/DMFMRadioWidget.appex
          codesign --force --sign - --entitlements DMFMRadio/DMFMRadio.entitlements Payload/*.app
          zip -r DMFMRadio.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DMFMRadio-ipa
          path: DMFMRadio.ipa
          retention-days: 14

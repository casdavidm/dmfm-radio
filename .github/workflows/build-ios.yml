name: Build iOS (.ipa)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package DMFMRadio IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project with XcodeGen
        run: |
          xcodegen generate

      - name: Build Archive (Release)
        run: |
          xcodebuild archive \
            -project DMFMRadio.xcodeproj \
            -scheme DMFMRadio \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -archivePath build/DMFMRadio.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .ipa File
        run: |
          mkdir -p build/Payload
          cp -R build/DMFMRadio.xcarchive/Products/Applications/DMFMRadio.app build/Payload/
          cd build
          zip -qr DMFMRadio.ipa Payload
          echo "DMFMRadio.ipa created successfully."
          ls -lh DMFMRadio.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DMFMRadio-ipa
          path: build/DMFMRadio.ipa
          retention-days: 14

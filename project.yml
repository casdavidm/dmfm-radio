name: DMFMRadio
options:
  bundleIdPrefix: com.casdavidm
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  DMFMRadio:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DMFMRadio
    dependencies:
      - target: DMFMRadioWidget
    entitlements:
      path: DMFMRadio/DMFMRadio.entitlements
      properties:
        com.apple.security.application-groups:
          - group.casdavidm.dmfmradio
    scheme:
      archive:
        config: Release
    settings:
      base:
        PRODUCT_NAME: DMFMRadio
        PRODUCT_BUNDLE_IDENTIFIER: com.casdavidm.dmfmradio
        INFOPLIST_FILE: DMFMRadio/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: DMFMRadio/DMFMRadio.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_PREVIEWS: NO

  DMFMRadioWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DMFMRadioWidget
      - path: DMFMRadio/Shared/RecentStationsManager.swift
      - path: DMFMRadio/Shared/PlayStationIntent.swift
      - path: DMFMRadio/Config/AppConfig.swift
      - path: DMFMRadio/Theme/AppTheme.swift
      - path: DMFMRadio/Views/TunerDialView.swift
    entitlements:
      path: DMFMRadioWidget/DMFMRadioWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.casdavidm.dmfmradio
    settings:
      base:
        PRODUCT_NAME: DMFMRadioWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.casdavidm.dmfmradio.widget
        INFOPLIST_FILE: DMFMRadioWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: DMFMRadioWidget/DMFMRadioWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        SKIP_INSTALL: YES
        ENABLE_PREVIEWS: NO

schemes:
  DMFMRadio:
    build:
      targets:
        DMFMRadio: all
        DMFMRadioWidget: all
    archive:
      config: Release

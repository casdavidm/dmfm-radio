name: DMFMRadio
options:
  bundleIdPrefix: com.casdavidm
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  DMFMRadio:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: DMFMRadio
    scheme:
      archive:
        config: Release
    settings:
      base:
        PRODUCT_NAME: DMFMRadio
        PRODUCT_BUNDLE_IDENTIFIER: com.casdavidm.dmfmradio
        INFOPLIST_FILE: DMFMRadio/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_PREVIEWS: YES

schemes:
  DMFMRadio:
    build:
      targets:
        DMFMRadio: all
    archive:
      config: Release
